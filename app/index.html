  header {

    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    margin: 0;

  }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: #eee;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #34a853, #1f9d55);
    width: 0%;
    transition: width .3s ease;
  }
  .progress-label {
    font-size: 12.5px;
    color: var(--sub);
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    gap: 8px;
  }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .btn:hover { background: #f2f3f5; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #1d4ed8; }
  input[type=file] { display: none; }

  .status-banner {
    background: #e6f4ea;
    color: #137333;
    padding: 8px 16px;
    font-size: 12.5px;
    text-align: center;
    border-bottom: 1px solid #ceead6;
    font-weight: 600;
  }

  .layout {
    display: flex;
    height: calc(100vh - 95px);
  }
  .left {
    width: 420px;
    min-width: 320px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  .search-row {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
  }
  .search-row input[type=text] {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
  }
  .region-chips {

    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .chip {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--sub);
    background: #fafafa;
  }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .list-head {
    display: grid;
    grid-template-columns: 1fr 54px 92px 36px 36px;
    gap: 6px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--sub);
    border-bottom: 1px solid var(--line);
    background: #fbfbfc;
  }
  .list {
    flex: 1;
    overflow-y: auto;
  }
  .region-header {
    position: sticky;
    top: 0;
    background: #f1f3f6;
    font-size: 11.5px;
    font-weight: 700;
    color: #445;
    padding: 5px 12px;
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 54px 92px 36px 36px;
    gap: 6px;
    align-items: center;
    padding: 6px 12px;
    border-bottom: 1px solid #f0f1f3;
    font-size: 13px;
    cursor: pointer;
  }
  .row:hover { background: #f7fbff; }
  .row.climbed { background: var(--green-light); }
  .row.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;

    font-weight: 400;
    color: var(--sub);
    font-size: 11px;
    margin-left: 4px;
  }
  .row .name .approx-mark {
    color: #c98a1a;
    font-weight: 700;
    margin-left: 2px;
  }
  .row .height {
    font-size: 11.5px;
    color: var(--sub);
    white-space: nowrap;
    text-align: right;
  }

    width: 100%;
    font-size: 11.5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 3px;
    color: var(--ink);
  }
  .dot-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    margin: 0 auto;
    display: block;
  }
  .dot-btn.climb-btn.on { background: var(--green); border-color: var(--green); }
  .dot-btn.unclimb-btn.on { background: var(--red); border-color: var(--red); }

  .right {
    flex: 1;
    position: relative;
    overflow: auto;
    background: #fdfdfd;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }
  .map-wrap {
    position: relative;
    display: inline-block;
  }
  .map-wrap img {
    display: block;
    width: 880px;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .marker {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25);

    transition: transform .15s ease, box-shadow .15s ease;

  .legend {

const STORAGE_KEY = 'BAC100_USER_DATA_V1';

let currentFilter = '전체';
let currentSearch = '';
let selectedRank = null;

// 로컬 스토리지에서 등반 정보 불러오기
function loadSavedData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      parsed.forEach(savedItem => {
        const target = MOUNTAINS.find(m => m.rank === savedItem.rank);
        if (target) {
          target.climbed = savedItem.climbed || false;
          target.date = savedItem.date || '';
        }
      });
    } catch(e) {
      console.error('데이터 불러오기 실패:', e);
    }
  }
}

// 로컬 스토리지에 자동 저장
function saveData() {
  const dataToSave = MOUNTAINS.map(m => ({
    rank: m.rank,
    climbed: m.climbed,
    date: m.date
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
  updateProgress();
}

function updateProgress() {
  const climbedCount = MOUNTAINS.filter(m => m.climbed).length;
  const pct = Math.round((climbedCount / MOUNTAINS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerText = `${climbedCount} / 100 완등 (${pct}%)`;
}

function initChips() {
  const regions = ['전체', '완등', '미완등', '강원', '경기', '서울', '충북', '충남', '경북', '경남', '전북', '전남', '지리산', '인천', '제주'];
  const chipsEl = document.getElementById('regionChips');
  chipsEl.innerHTML = '';
  regions.forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (r === currentFilter ? ' active' : '');
    chip.innerText = r;
    chip.onclick = () => {
      currentFilter = r;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderList();
    };
    chipsEl.appendChild(chip);
  });
}

function getFilteredList() {
  return MOUNTAINS.filter(m => {
    if (currentFilter === '완등' && !m.climbed) return false;
    if (currentFilter === '미완등' && m.climbed) return false;
    if (currentFilter !== '전체' && currentFilter !== '완등' && currentFilter !== '미완등' && m.region !== currentFilter) return false;
    if (currentSearch.trim()) {
      return m.name.toLowerCase().includes(currentSearch.trim().toLowerCase());
    }
    return true;
  });
}

function renderList() {
  const listEl = document.getElementById('listEl');
  listEl.innerHTML = '';
  const filtered = getFilteredList();

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="padding:30px;text-align:center;color:#888;">검색 결과가 없습니다.</div>';
    return;
  }

  filtered.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row' + (m.climbed ? ' climbed' : '') + (m.rank === selectedRank ? ' selected' : '');
    row.id = `row-${m.rank}`;
    
    row.innerHTML = `
      <div class="name">
        #${m.rank} ${m.name} <span class="region-tag">[${m.region}]</span>${m.approx ? '<span class="approx-mark">*</span>' : ''}
      </div>
      <div class="height">${m.height}</div>
      <div onclick="event.stopPropagation()">
        <input type="date" value="${m.date}" onchange="updateDate(${m.rank}, this.value)">
      </div>
      <div style="text-align:center;" onclick="event.stopPropagation()">
        <button class="dot-btn climb-btn ${m.climbed ? 'on' : ''}" onclick="setClimb(${m.rank}, true)"></button>
      </div>
      <div style="text-align:center;" onclick="event.stopPropagation()">
        <button class="dot-btn unclimb-btn ${!m.climbed ? 'on' : ''}" onclick="setClimb(${m.rank}, false)"></button>
      </div>
    `;

    row.onclick = () => selectMountain(m.rank);
    listEl.appendChild(row);
  });
}

function renderMarkers() {
  const mapWrap = document.getElementById('mapWrap');
  document.querySelectorAll('.marker').forEach(el => el.remove());

  MOUNTAINS.forEach(m => {
    const marker = document.createElement('div');
    marker.className = 'marker ' + (m.climbed ? 'climbed' : 'unclimbed') + (m.approx ? ' approx' : '');
    marker.id = `marker-${m.rank}`;
    marker.style.left = m.xPct + '%';
    marker.style.top = m.yPct + '%';
    marker.title = `#${m.rank} ${m.name} (${m.height})`;

    marker.onclick = (e) => {
      e.stopPropagation();
      selectMountain(m.rank);
      const rowEl = document.getElementById(`row-${m.rank}`);
      if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    mapWrap.appendChild(marker);
  });
}

function selectMountain(rank) {
  selectedRank = rank;
  document.querySelectorAll('.row').forEach(r => r.classList.remove('selected'));
  document.querySelectorAll('.marker').forEach(m => m.classList.remove('pulse'));

  const selRow = document.getElementById(`row-${rank}`);
  if (selRow) selRow.classList.add('selected');

  const selMarker = document.getElementById(`marker-${rank}`);
  if (selMarker) selMarker.classList.add('pulse');
}

function setClimb(rank, climbed) {
  const m = MOUNTAINS.find(item => item.rank === rank);
  if (m) {
    m.climbed = climbed;
    if (climbed && !m.date) {
      const today = new Date().toISOString().split('T')[0];
      m.date = today;
    }
    saveData();
    renderList();
    renderMarkers();
    selectMountain(rank);
  }
}

function updateDate(rank, dateVal) {
  const m = MOUNTAINS.find(item => item.rank === rank);
  if (m) {
    m.date = dateVal;
    if (dateVal && !m.climbed) {
      m.climbed = true;
    }
    saveData();
    renderList();
    renderMarkers();
  }
}

document.getElementById('searchInput').oninput = (e) => {
  currentSearch = e.target.value;
  renderList();
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('모든 등반 기록과 일자를 초기화하시겠습니까?')) {
    MOUNTAINS.forEach(m => {
      m.climbed = false;
      m.date = '';
    });
    saveData();
    renderList();
    renderMarkers();
  }
};

document.getElementById('exportBtn').onclick = () => {
  const exportData = MOUNTAINS.map(m => ({ rank: m.rank, climbed: m.climbed, date: m.date }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `BAC100_등반기록_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
};

document.getElementById('importBtn').onclick = () => {
  document.getElementById('importFile').click();
};

document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const imported = JSON.parse(evt.target.result);
      imported.forEach(item => {
        const target = MOUNTAINS.find(m => m.rank === item.rank);
        if (target) {
          target.climbed = !!item.climbed;
          target.date = item.date || '';
        }
      });
      saveData();
      renderList();
      renderMarkers();
      alert('성공적으로 기록을 복구했습니다.');
    } catch(err) {
      alert('올바른 파일 형식이 아닙니다.');
    }
  };
  reader.readAsText(file);
};

// PWA 서비스 워커 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => {
      console.log('PWA Service Worker Registered');
    }).catch(err => console.log('SW Registration failed:', err));
  });
}

// 초기화
window.onload = () => {
  loadSavedData();
  initChips();
  renderList();
  renderMarkers();
  updateProgress();
};
</script>
</body>
</html>
