  add('nm-poi', 'poi', base(11, '#ffe9b0'), { minzoom: 13 });
  add('nm-place', 'place', base(12.5, '#ffffff'));
  const pk = base(13.5, '#ffffff');
  pk.layout['text-field'] = ['case', ['has', 'ele'],
    ['concat', name, '\n', ['to-string', ['get', 'ele']], 'm'], name];
  pk.layout['symbol-sort-key'] = ['-', 0, ['to-number', ['get', 'ele'], 0]];   // 높은 봉우리 먼저
  add('nm-peak', 'mountain_peak', pk);
}
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
// 손으로 지도를 움직이면 따라가기를 멈춘다
['dragstart', 'wheel', 'touchstart'].forEach(ev => map.on(ev, e => { if (e.originalEvent) follow = false; }));

const $ = id => document.getElementById(id);
// 닫기: 새 창(탭)으로 열린 이 페이지를 닫는다. 브라우저가 닫기를 막으면
// (주소로 바로 들어온 경우 등) 산 글로 이동한다.
$('close').onclick = ev => {
  ev.preventDefault();
  const href = $('close').href;
  window.close();
  setTimeout(() => { if (!window.closed) location.href = href; }, 400);
};
const fmt = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h + ':' + String(m).padStart(2, '0'); };
function render() {
  const p = at(dist);
  me.setLngLat([p.lon, p.lat]);
  const src = map.getSource('done'); if (src) src.setData(line(dist));
  $('s-dist').textContent = (dist/LEN*TOTAL_KM).toFixed(2) + 'km';
  $('s-ele').textContent = Math.round(p.ele) + 'm';
  $('s-time').textContent = fmt(p.t);
  const c = START_CLOCK + p.t;
  $('s-clock').textContent = String(Math.floor(c/3600)).padStart(2, '0') + ':' + String(Math.floor(c%3600/60)).padStart(2, '0');
  drawProfile();
  if (follow) {
    const want = bearing(at(dist-60), at(dist+220));
    if (brg === null) brg = want;
    let d = ((want - brg + 540) % 360) - 180;
    brg += d * 0.035;
    const want2 = clearPitch(p, brg);
    pit += (want2 - pit) * (want2 < pit ? 0.14 : 0.03);   // 가려지면 빨리 올라가고, 풀리면 천천히 내려온다
    // 지형 자료가 아직 안 받아진 곳에서는 지도가 땅 높이를 0 으로 알아 카메라가 산속에
    // 잠긴다. 그만큼 카메라를 뒤로 물려(줌을 낮춰) 항상 땅 위에 있게 한다.
    let zoom = ZOOM;
    const miss = p.ele * EXAG - (map.transform && map.transform.elevation || 0);
    if (miss > 60) { const D = camDist(p); zoom = ZOOM - Math.log2((D + miss / Math.cos(rad(pit))) / D); }
    map.jumpTo({ center: [p.lon, p.lat], bearing: brg, pitch: pit, zoom, padding: PAD });
  }
}
// 카메라와 현재 위치 사이를 산이 가리는지 본다. 가리면 더 위에서 내려다보도록
// 기울기를 줄인다. 가파르고 높은 산에서 카메라가 능선 뒤로 숨는 것을 막는다.
const ZOOM = 15.4, PITCH_MAX = 66, PITCH_MIN = 24, EXAG = 1.35;
let pit = PITCH_MAX;
function shift(p, deg, m) {
  return [p.lon + m*Math.sin(rad(deg)) / (111320*Math.cos(rad(p.lat))), p.lat + m*Math.cos(rad(deg)) / 111320];
}
function camDist(p) {            // 기본 줌에서 카메라까지 거리(m)
  const H = map.getContainer().clientHeight || 600;
  return 1.5 * H * 40075016.686 * Math.cos(rad(p.lat)) / (512 * Math.pow(2, ZOOM));
}
function clearPitch(p, b) {
  const D = camDist(p);
  for (let pitch = PITCH_MAX; pitch > PITCH_MIN; pitch -= 3) {
    const back = D*Math.sin(rad(pitch)), up = D*Math.cos(rad(pitch));
    let ok = true;
    for (let f = 0.12; f <= 1.001 && ok; f += 0.11) {
      let g = null;
      try { g = map.queryTerrainElevation(shift(p, b + 180, back*f)); } catch (e) {}
      if (g != null && g + 40 + 90*f > up*f) ok = false;   // 시선이 땅보다 넉넉히 위에 있어야 한다
    }
    if (ok) return pitch;
  }
  return PITCH_MIN;
}
function tick(now) {
  const dt = Math.min(0.25, (now - (last || now)) / 1000); last = now;
  if (playing) {
    dist += LEN / DURATION * speed * dt;
    if (dist >= LEN) { dist = LEN; setPlay(false); render(); overview(); }
    else render();
  }
  requestAnimationFrame(tick);
}
// 배경음악: 재생 중에만 흐른다. 끄면 다음에 열 때도 꺼진 채로 둔다.
const bgm = document.getElementById('bgm');
bgm.volume = 0.5;
let sound = true;
try { sound = localStorage.getItem('bgm') !== 'off'; } catch (e) {}
function music(on) {
  if (on && sound) { const pr = bgm.play(); if (pr && pr.catch) pr.catch(() => {}); }
  else bgm.pause();
}
function paintSound() {
  const b = document.getElementById('snd');
  b.classList.toggle('off', !sound);
  b.setAttribute('aria-pressed', String(sound));
  b.setAttribute('aria-label', sound ? '배경음악 끄기' : '배경음악 켜기');
}
function setPlay(on) {
  playing = on;
  music(on);
  $('play').textContent = on ? '❚❚ 멈춤' : (dist >= LEN ? '↺ 다시 보기' : '▶ 재생');
}
function overview() {
  follow = false; brg = null;
  map.fitBounds(bounds, { padding: {top: 90, bottom: 230, left: 40, right: 40}, pitch: 55, bearing: -20, duration: 1800 });
}
$('snd').onclick = () => {
  sound = !sound;
  try { localStorage.setItem('bgm', sound ? 'on' : 'off'); } catch (e) {}
  paintSound(); music(playing);
};
paintSound();
$('play').onclick = () => {
  if (playing) return setPlay(false);
  if (dist >= LEN) { dist = 0; bgm.currentTime = 0; }
  music(true);          // 누른 그 순간에 시작해야 브라우저가 소리를 허락한다
  const p = at(dist); brg = bearing(at(dist), at(dist+220));
  pit = clearPitch(p, brg);
  map.flyTo({ center: [p.lon, p.lat], bearing: brg, pitch: pit, zoom: ZOOM, padding: PAD, duration: 1800 });
  map.once('moveend', () => { follow = true; setPlay(true); });
};
$('over').onclick = () => { setPlay(false); overview(); };
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
  speed = +b.dataset.sp;
  document.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b));
});

// 고도 그래프
const cv = $('prof'), cx = cv.getContext('2d');
const eMin = Math.min(...ELE), eMax = Math.max(...ELE);
function drawProfile() {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
  const X = d => d/LEN*w, Y = e => h - 3 - (e-eMin)/(eMax-eMin)*(h-10);
  const path = upto => { cx.beginPath(); cx.moveTo(0, h);
    for (let i = 0; i < cum.length && cum[i] <= upto; i++) cx.lineTo(X(cum[i]), Y(ELE[i]));
    const p = at(upto); cx.lineTo(X(upto), Y(p.ele)); cx.lineTo(X(upto), h); cx.closePath(); };
  path(LEN); cx.fillStyle = 'rgba(255,255,255,.22)'; cx.fill();
  path(dist); cx.fillStyle = '#ff5a3c'; cx.fill();
  const p = at(dist);
  cx.beginPath(); cx.arc(X(dist), Y(p.ele), 4, 0, 7); cx.fillStyle = '#fff'; cx.fill();
}
function seek(ev) {
  const r = cv.getBoundingClientRect();
  dist = Math.max(0, Math.min(1, (ev.clientX - r.left)/r.width)) * LEN;
  if (!follow) { const p = at(dist); brg = bearing(at(dist-60), at(dist+220)); follow = true; }
  setPlay(playing); render();
}
let dragging = false;
cv.addEventListener('pointerdown', e => { dragging = true; cv.setPointerCapture(e.pointerId); seek(e); });
cv.addEventListener('pointermove', e => { if (dragging) seek(e); });
cv.addEventListener('pointerup', () => dragging = false);
addEventListener('resize', drawProfile);
if (window.ResizeObserver) new ResizeObserver(() => { map.resize(); drawProfile(); }).observe(document.getElementById('map'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { map.resize(); drawProfile(); } });
</script>
</body>
</html>
