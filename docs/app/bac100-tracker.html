<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블랙야크 100대 명산 등반 트래커</title>

<!-- PWA 매니페스트 및 테마 설정 -->
<!-- 내려받기 판: 매니페스트를 쓰지 않습니다 -->
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BAC100">

<style>
  :root {
    --green: #1f9d55;
    --green-light: #e6f6ec;
    --red: #d64545;
    --red-light: #fdecec;
    --ink: #1f2430;
    --sub: #6b7280;
    --line: #e5e7eb;
    --bg: #f7f8fa;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 700;
  }
  header h1 span {
    color: var(--sub);
    font-weight: 400;
    font-size: 12px;
    margin-left: 8px;
  }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 260px;
  }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: #eee;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #34a853, #1f9d55);
    width: 0%;
    transition: width .3s ease;
  }
  .progress-label {
    font-size: 12.5px;
    color: var(--sub);
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    gap: 8px;
  }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .btn:hover { background: #f2f3f5; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #1d4ed8; }
  input[type=file] { display: none; }

  .status-banner {
    background: #e6f4ea;
    color: #137333;
    padding: 8px 16px;
    font-size: 12.5px;
    text-align: center;
    border-bottom: 1px solid #ceead6;
    font-weight: 600;
  }

  .layout {
    display: flex;
    height: calc(100vh - 95px);
  }
  .left {
    width: 420px;
    min-width: 320px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  .search-row {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
  }
  .search-row input[type=text] {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
  }
  .region-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .chip {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--sub);
    background: #fafafa;
  }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .list-head {
    display: grid;
    grid-template-columns: 1fr 54px 92px 36px 36px;
    gap: 6px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--sub);
    border-bottom: 1px solid var(--line);
    background: #fbfbfc;
  }
  .list {
    flex: 1;
    overflow-y: auto;
  }
  .region-header {
    position: sticky;
    top: 0;
    background: #f1f3f6;
    font-size: 11.5px;
    font-weight: 700;
    color: #445;
    padding: 5px 12px;
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 54px 92px 36px 36px;
    gap: 6px;
    align-items: center;
    padding: 6px 12px;
    border-bottom: 1px solid #f0f1f3;
    font-size: 13px;
    cursor: pointer;
  }
  .row:hover { background: #f7fbff; }
  .row.climbed { background: var(--green-light); }
  .row.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .name .region-tag {
    font-weight: 400;
    color: var(--sub);
    font-size: 11px;
    margin-left: 4px;
  }
  .row .name .approx-mark {
    color: #c98a1a;
    font-weight: 700;
    margin-left: 2px;
  }
  .row .height {
    font-size: 11.5px;
    color: var(--sub);
    white-space: nowrap;
    text-align: right;
  }
  .row input[type=date] {
    width: 100%;
    font-size: 11.5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 3px;
    color: var(--ink);
  }
  .dot-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    margin: 0 auto;
    display: block;
  }
  .dot-btn.climb-btn.on { background: var(--green); border-color: var(--green); }
  .dot-btn.unclimb-btn.on { background: var(--red); border-color: var(--red); }

  .right {
    flex: 1;
    position: relative;
    overflow: auto;
    background: #fdfdfd;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }
  .map-wrap {
    position: relative;
    display: inline-block;
  }
  .map-wrap svg.kmap {
    display: block;
    height: 900px;
    width: auto;
    max-width: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }
  .marker {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .marker.unclimbed { background: var(--red); }
  .marker.climbed { background: var(--green); }
  .marker.approx { border-style: dashed; border-color: #c98a1a; }
  .marker.pulse {
    transform: translate(-50%, -50%) scale(1.9);
    box-shadow: 0 0 0 4px rgba(37,99,235,.45);
    z-index: 5;
  }
  .marker:hover { transform: translate(-50%, -50%) scale(1.6); z-index: 4; }

  .legend {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,.95);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    display: flex;
    gap: 12px;
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #d7d9de; border-radius: 5px; }

  .kmap { display: block; user-select: none; }
  .kmap .land path { fill: #e9ece9; stroke: none; }
  .kmap .prov path { fill: #eef1ee; stroke: #fff; stroke-width: 1.6;
    stroke-linejoin: round; }
  .kmap .prov[data-region="서울"] path { fill: #dbe3f2; }
  .kmap .prov[data-region="인천"] path { fill: #e9f0f6; }
  .kmap .prov[data-region="경기"] path { fill: #e0eaf7; }
  .kmap .prov[data-region="강원"] path { fill: #dfeee4; }
  .kmap .prov[data-region="충북"] path { fill: #f6f0dc; }
  .kmap .prov[data-region="충남"] path { fill: #fae7db; }
  .kmap .prov[data-region="경북"] path { fill: #e8e3f4; }
  .kmap .prov[data-region="경남"] path { fill: #dcecf2; }
  .kmap .prov[data-region="전북"] path { fill: #f5ecdf; }
  .kmap .prov[data-region="전남"] path { fill: #dff0e8; }
  .kmap .prov[data-region="지리산"] path { fill: #eae4f3; }
  .kmap .prov[data-region="제주도"] path { fill: #f4e5f2; }
  .kmap .plabel { font-size: 26px; font-weight: 700; fill: #7a8794;
    text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
  .mapsrc { margin: 0; padding: 10px 16px 20px; font-size: 11.5px; color: var(--sub);
    text-align: center; }

  /* 어플 원본에는 미디어쿼리가 없다. 좁은 화면에서는 .left 가 320px 을
     차지해 지도 자리에 20~30px 밖에 남지 않아 마커만 세로로 늘어섰다.
     세로로 쌓고, 지도를 먼저 보여준다. */
  @media (max-width: 760px) {
    body { overflow-y: auto; }
    header { padding: 12px 14px; }
    header h1 { font-size: 15px; }
    .progress-wrap { min-width: 0; width: 100%; }

    .layout { flex-direction: column; height: auto; }
    .left { width: 100%; min-width: 0; border-right: none;
      border-bottom: 1px solid var(--line); order: 2; }
    .list { overflow-y: visible; max-height: none; }
    .right { order: 1; overflow: visible; padding: 12px;
      border-bottom: 1px solid var(--line); }
    .map-wrap { width: 100%; }
    .map-wrap svg.kmap { height: auto; width: 100%; max-width: 460px;
      margin: 0 auto; }
    .legend { flex-wrap: wrap; }

    /* 표가 좁아지므로 '등반일시' 칸을 줄인다 */
    .list-head, .row { grid-template-columns: 1fr 46px 74px 32px 32px;
      gap: 4px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>블랙야크 100대 명산 등반 트래커 <span>BAC 100 · 자동 저장 지원</span></h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 100 완등 (0%)</div>
  </div>
  <div class="toolbar">
    <button class="btn" id="resetBtn">전체 초기화</button>
    <button class="btn" id="exportBtn">백업(내보내기)</button>
    <button class="btn" id="importBtn">복구(불러오기)</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</header>

<div class="status-banner">
  ✨ 기록이 이 기기에 자동으로 저장되며, 앱을 열 때마다 자동으로 복원됩니다.
</div>

<div class="layout">
  <div class="left">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="산 이름 검색...">

    <div class="list-head">
      <div>산 이름</div>
      <div style="text-align:right;">높이</div>
      <div>등반일시</div>
      <div style="text-align:center;">등반</div>
      <div style="text-align:center;">미등반</div>
    </div>
    <div class="list" id="listEl"></div>
  </div>

const STORAGE_KEY = 'BAC100_USER_DATA_V2';

let currentFilter = '전체';
let currentSearch = '';
let selectedRank = null;

// 로컬 스토리지에서 등반 정보 불러오기
function loadSavedData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      parsed.forEach(savedItem => {
        const target = MOUNTAINS.find(m => m.rank === savedItem.rank);
        if (target) {
          target.climbed = savedItem.climbed || false;
          target.date = savedItem.date || '';
        }
      });
    } catch(e) {
      console.error('데이터 불러오기 실패:', e);
    }
  }
}

// 로컬 스토리지에 자동 저장
function saveData() {
  const dataToSave = MOUNTAINS.map(m => ({
    rank: m.rank,
    climbed: m.climbed,
    date: m.date
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
  updateProgress();
}

function updateProgress() {
  const climbedCount = MOUNTAINS.filter(m => m.climbed).length;
  const pct = Math.round((climbedCount / MOUNTAINS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerText = `${climbedCount} / 100 완등 (${pct}%)`;
}

function initChips() {
  const regions = ["전체", "완등", "미완등", "서울", "인천", "경기", "강원", "충북", "충남", "경북", "경남", "전북", "전남", "지리산", "제주도"];
  const chipsEl = document.getElementById('regionChips');
  chipsEl.innerHTML = '';
  regions.forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (r === currentFilter ? ' active' : '');
    chip.innerText = r;
    chip.onclick = () => {
      currentFilter = r;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderList();
    };
    chipsEl.appendChild(chip);
  });
}

function getFilteredList() {
  return MOUNTAINS.filter(m => {
    if (currentFilter === '완등' && !m.climbed) return false;
    if (currentFilter === '미완등' && m.climbed) return false;
    if (currentFilter !== '전체' && currentFilter !== '완등' && currentFilter !== '미완등' && m.region !== currentFilter) return false;
    if (currentSearch.trim()) {
      return m.name.toLowerCase().includes(currentSearch.trim().toLowerCase());
    }
    return true;
  });
}

function renderList() {
  const listEl = document.getElementById('listEl');
  listEl.innerHTML = '';
  const filtered = getFilteredList();

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="padding:30px;text-align:center;color:#888;">검색 결과가 없습니다.</div>';
    return;
  }

  filtered.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row' + (m.climbed ? ' climbed' : '') + (m.rank === selectedRank ? ' selected' : '');
    row.id = `row-${m.rank}`;
    
    row.innerHTML = `
      <div class="name">
        #${m.rank} ${m.name} <span class="region-tag">[${m.region}]</span>${m.approx ? '<span class="approx-mark">*</span>' : ''}
      </div>
      <div class="height">${m.height}</div>
      <div onclick="event.stopPropagation()">
        <input type="date" value="${m.date}" onchange="updateDate(${m.rank}, this.value)">
      </div>
      <div style="text-align:center;" onclick="event.stopPropagation()">
        <button class="dot-btn climb-btn ${m.climbed ? 'on' : ''}" onclick="setClimb(${m.rank}, true)"></button>
      </div>
      <div style="text-align:center;" onclick="event.stopPropagation()">
        <button class="dot-btn unclimb-btn ${!m.climbed ? 'on' : ''}" onclick="setClimb(${m.rank}, false)"></button>
      </div>
    `;

    row.onclick = () => selectMountain(m.rank);
    listEl.appendChild(row);
  });
}

function renderMarkers() {
  const mapWrap = document.getElementById('mapWrap');
  document.querySelectorAll('.marker').forEach(el => el.remove());

  MOUNTAINS.forEach(m => {
    const marker = document.createElement('div');
    marker.className = 'marker ' + (m.climbed ? 'climbed' : 'unclimbed') + (m.approx ? ' approx' : '');
    marker.id = `marker-${m.rank}`;
    marker.style.left = m.xPct + '%';
    marker.style.top = m.yPct + '%';
    marker.title = `#${m.rank} ${m.name} (${m.height})`;

    marker.onclick = (e) => {
      e.stopPropagation();
      selectMountain(m.rank);
      const rowEl = document.getElementById(`row-${m.rank}`);
      if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    mapWrap.appendChild(marker);
  });
}

function selectMountain(rank) {
  selectedRank = rank;
  document.querySelectorAll('.row').forEach(r => r.classList.remove('selected'));
  document.querySelectorAll('.marker').forEach(m => m.classList.remove('pulse'));

  const selRow = document.getElementById(`row-${rank}`);
  if (selRow) selRow.classList.add('selected');

  const selMarker = document.getElementById(`marker-${rank}`);
  if (selMarker) selMarker.classList.add('pulse');
}

function setClimb(rank, climbed) {
  const m = MOUNTAINS.find(item => item.rank === rank);
  if (m) {
    m.climbed = climbed;
    if (climbed && !m.date) {
      const today = new Date().toISOString().split('T')[0];
      m.date = today;
    }
    saveData();
    renderList();
    renderMarkers();
    selectMountain(rank);
  }
}

function updateDate(rank, dateVal) {
  const m = MOUNTAINS.find(item => item.rank === rank);
  if (m) {
    m.date = dateVal;
    if (dateVal && !m.climbed) {
      m.climbed = true;
    }
    saveData();
    renderList();
    renderMarkers();
  }
}

document.getElementById('searchInput').oninput = (e) => {
  currentSearch = e.target.value;
  renderList();
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('모든 등반 기록과 일자를 초기화하시겠습니까?')) {
    MOUNTAINS.forEach(m => {
      m.climbed = false;
      m.date = '';
    });
    saveData();
    renderList();
    renderMarkers();
  }
};

document.getElementById('exportBtn').onclick = () => {
  const exportData = MOUNTAINS.map(m => ({ rank: m.rank, climbed: m.climbed, date: m.date }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `BAC100_등반기록_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
};

document.getElementById('importBtn').onclick = () => {
  document.getElementById('importFile').click();
};

document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const imported = JSON.parse(evt.target.result);
      imported.forEach(item => {
        const target = MOUNTAINS.find(m => m.rank === item.rank);
        if (target) {
          target.climbed = !!item.climbed;
          target.date = item.date || '';
        }
      });
      saveData();
      renderList();
      renderMarkers();
      alert('성공적으로 기록을 복구했습니다.');
    } catch(err) {
      alert('올바른 파일 형식이 아닙니다.');
    }
  };
  reader.readAsText(file);
};

// PWA 서비스 워커 등록
// 내려받기 판: 서비스워커를 쓰지 않습니다

// 초기화
window.onload = () => {
  loadSavedData();
  initChips();
  renderList();
  renderMarkers();
  updateProgress();
};
